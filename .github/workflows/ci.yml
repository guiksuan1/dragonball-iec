name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar Dependências
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: Executar Lint
        run: |
          cd backend
          pnpm lint

      - name: Validação de Tipos (TypeScript)
        run: |
          cd backend
          pnpm typecheck

      - name: Compilar Aplicação (Build)
        run: |
          cd backend
          pnpm build